<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,black,black,black);
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:20px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
color:white;
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group input,
.input-group select{
width:100%;
padding:14px 45px 14px 15px;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

.input-group i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#555;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
margin-bottom:20px;
}

.options a{
color:wheat;
text-decoration:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:blue;
color:#cfddcd;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:#333085;
}

.home{
display:block;
margin-top:15px;
text-align:center;
text-decoration:none;
color:whitesmoke;
}

.signup{
margin-top:20px;
text-align:center;
}

.signup a{
color:whitesmoke;
font-weight:bold;
}

@media(max-width:500px){
.login-box{
padding:25px;
}
}
</style>
</head>

<body>

<div class="login-box">

<h2>Welcome Back</h2>

<form id="loginForm">

<div class="input-group">
<select required>
<option value="">Select Role</option>
<option>Admin</option>
<option>User</option>
</select>
</div>

<div class="input-group">
<input type="email" id="email" placeholder="Email Address" required><i class="bi bi-envelope"></i>
</div>

<div class="input-group">
<input
type="password"
id="password"
placeholder="Password"
required
pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#^()_+\-=\[\]{};':&quot;\\|,.<>\/]).{8,}$"
title="Minimum 8 characters, 1 uppercase, 1 lowercase, 1 number and 1 special character"><i class="bi bi-eye" id="eye"></i>
</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="404.html">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

<a href="index.html" class="home">
🏠 Home
</a>

<div class="signup">
Don't have an account?
<a href="sig.html">Sign Up</a>
</div>

</form>

</div>

<script>

const eye=document.getElementById("eye");
const pass=document.getElementById("password");

eye.onclick=function(){

if(pass.type=="password"){
pass.type="text";
eye.classList.remove("bi-eye");
eye.classList.add("bi-eye-slash");
}else{
pass.type="password";
eye.classList.remove("bi-eye-slash");
eye.classList.add("bi-eye");
}

}
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const role = document.querySelector("select").value;
    const password = document.getElementById("password").value;

    // Password Validation
    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#^()_+\-=\[\]{};':"\\|,.<>\/]).{8,}$/;

    if (!passwordPattern.test(password)) {
        alert("Password must contain:\n\n• Minimum 8 characters\n• One Uppercase\n• One Lowercase\n• One Number\n• One Special Character");
        return;
    }

    // Role Validation
    if (role === "Admin") {
        window.location.href = "admin.html";
    } else if (role === "User") {
        window.location.href = "user.html";
    } else {
        alert("Please select a role.");
    }
});
const role = document.querySelector("select").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

localStorage.setItem("userEmail", email);
</script>

</body>
</html>
