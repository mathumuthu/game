<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Academy Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #f97316;
            --secondary-light: #ffedd5;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --info: #06b6d4;
            --info-light: #cffafe;
            --dark: #0f172a;
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-700: #374151;
            --gray-600: #4b5563;
            --gray-500: #6b7280;
            --gray-400: #9ca3af;
            --gray-300: #d1d5db;
            --gray-200: #e5e7eb;
            --gray-100: #f3f4f6;
            --gray-50: #f9fafb;
            --white: #ffffff;
            --sidebar-width: 260px;
            --sidebar-collapsed: 70px;
            --header-height: 70px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); overflow-x: hidden; }
        
html {
    width: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
}

body {
    width: 100%;
    overflow-x: hidden;
    touch-action: pan-y;
}











        .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-width); height: 100vh; background: var(--white); border-right: 1px solid var(--gray-200); z-index: 1000; transition: var(--transition); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar.collapsed { width: var(--sidebar-collapsed); }
        .sidebar-header { height: var(--header-height); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--gray-100); gap: 12px; }
        .sidebar-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 18px; flex-shrink: 0; animation: logoPulse 2s ease-in-out infinite; }
        @keyframes logoPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,99,235,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(37,99,235,0); } }
        .sidebar-title { font-weight: 700; font-size: 18px; color: var(--dark); white-space: nowrap; transition: var(--transition); }
        .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
        .sidebar-toggle { position: absolute; right: -14px; top: 80px; width: 28px; height: 28px; background: var(--primary); border: 2px solid var(--white); border-radius: 50%; color: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; z-index: 1001; transition: var(--transition); box-shadow: var(--shadow-md); }
        .sidebar-toggle:hover { transform: scale(1.15); background: var(--primary-dark); }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
        .nav-section { margin-bottom: 8px; }
        .nav-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-400); padding: 8px 16px; transition: var(--transition); }
        .sidebar.collapsed .nav-section-title { display: none; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--radius-md); cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--gray-600); margin-bottom: 2px; position: relative; overflow: hidden; }
        .nav-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); border-radius: 0 3px 3px 0; transform: scaleY(0); transition: var(--transition); }
        .nav-item:hover { background: var(--gray-50); color: var(--gray-900); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-item.active::before { transform: scaleY(1); }
        .nav-item i { width: 22px; text-align: center; font-size: 16px; flex-shrink: 0; transition: var(--transition); }
        .nav-item:hover i { transform: translateY(-2px); }
        .nav-item span { font-size: 14px; white-space: nowrap; transition: var(--transition); }
        .sidebar.collapsed .nav-item span { opacity: 0; width: 0; }
        .nav-badge { margin-left: auto; background: var(--danger); color: var(--white); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; transition: var(--transition); }
        .sidebar.collapsed .nav-badge { position: absolute; right: 8px; top: 8px; padding: 3px 5px; font-size: 9px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--gray-100); }
        .user-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-md); transition: var(--transition); cursor: pointer; }
        .user-card:hover { background: var(--gray-50); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gray-200); flex-shrink: 0; }
        .user-info { transition: var(--transition); overflow: hidden; }
        .sidebar.collapsed .user-info { opacity: 0; width: 0; }
        .user-name { font-weight: 600; font-size: 14px; color: var(--gray-900); }
        .user-role { font-size: 12px; color: var(--gray-500); }
        .main-wrapper { margin-left: var(--sidebar-width); transition: var(--transition); min-height: 100vh; }
        .sidebar.collapsed ~ .main-wrapper { margin-left: var(--sidebar-collapsed); }
        .header { height: var(--header-height); background: var(--white); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 100; transition: var(--transition); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 10px; }
        .page-title .breadcrumb { font-size: 13px; font-weight: 400; color: var(--gray-400); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .header-btn { width: 42px; height: 42px; border-radius: var(--radius-md); border: 1px solid var(--gray-200); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gray-600); transition: var(--transition); position: relative; font-size: 16px; }
        .header-btn:hover { background: var(--gray-50); border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .header-btn .notif-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid var(--white); animation: notifBlink 1.5s ease-in-out infinite; }
        @keyframes notifBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .header-avatar { width: 42px; height: 42px; border-radius: var(--radius-md); object-fit: cover; cursor: pointer; border: 2px solid var(--gray-200); transition: var(--transition); }
        .header-avatar:hover { border-color: var(--primary); transform: scale(1.05); }
        .page-content { padding: 24px 28px; animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; }
        .page.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: var(--white); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--gray-100); transition: var(--transition); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; border-radius: 50%; opacity: 0.05; transform: translate(30%, -30%); }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--gray-200); }
        .stat-card:hover::after { opacity: 0.1; }
        .stat-card.blue::after { background: var(--primary); }
        .stat-card.orange::after { background: var(--secondary); }
        .stat-card.green::after { background: var(--success); }
        .stat-card.red::after { background: var(--danger); }
        .stat-card.cyan::after { background: var(--info); }
        .stat-card.purple::after { background: #8b5cf6; }
        .stat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: var(--transition); }
        .stat-card:hover .stat-icon { transform: scale(1.1) rotate(5deg); }
        .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
        .stat-icon.orange { background: var(--secondary-light); color: var(--secondary); }
        .stat-icon.green { background: var(--success-light); color: var(--success); }
        .stat-icon.red { background: var(--danger-light); color: var(--danger); }
        .stat-icon.cyan { background: var(--info-light); color: var(--info); }
        .stat-icon.purple { background: #ede9fe; color: #8b5cf6; }
        .stat-trend { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .stat-trend.up { background: var(--success-light); color: var(--success); }
        .stat-trend.down { background: var(--danger-light); color: var(--danger); }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--dark); margin-bottom: 4px; transition: var(--transition); }
        .stat-card:hover .stat-value { transform: scale(1.02); }
        .stat-label { font-size: 14px; color: var(--gray-500); }
        .chart-container { background: var(--white); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--gray-100); transition: var(--transition); }
        .chart-container:hover { box-shadow: var(--shadow-md); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-title { font-size: 16px; font-weight: 700; color: var(--dark); }
        .chart-actions { display: flex; gap: 8px; }
        .chart-btn { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--gray-200); background: var(--white); font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); color: var(--gray-600); }
        .chart-btn:hover, .chart-btn.active { background: var(--primary); color: var(--white); border-color: var(--primary); }
        .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 200px; padding: 10px 0; }
        .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .bar { width: 100%; border-radius: 6px 6px 0 0; transition: var(--transition); position: relative; cursor: pointer; }
        .bar:hover { opacity: 0.85; transform: scaleX(1.05); }
        .bar-label { font-size: 11px; color: var(--gray-500); font-weight: 500; }
        .line-chart { height: 200px; position: relative; }
        .line-chart svg { width: 100%; height: 100%; }
        .doughnut-container { display: flex; align-items: center; gap: 24px; }
        .doughnut-chart { width: 160px; height: 160px; }
        .doughnut-legend { display: flex; flex-direction: column; gap: 10px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .legend-value { font-weight: 700; margin-left: auto; }
        .table-card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-100); overflow: hidden; transition: var(--transition); }
        .table-card:hover { box-shadow: var(--shadow-md); }

        .table-title { font-size: 16px; font-weight: 700; color: var(--dark); }

        .table-search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .table-search i { color: var(--gray-400); font-size: 14px; }
        .table-search input { border: none; background: none; outline: none; font-size: 13px; font-family: inherit; width: 180px; color: var(--gray-700); }
        .table-search input::placeholder { color: var(--gray-400); }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 14px 24px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-500); background: var(--gray-50); border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
        tbody tr { transition: var(--transition); border-bottom: 1px solid var(--gray-50); }

        tbody td { padding: 16px 24px; font-size: 14px; color: var(--gray-700); vertical-align: middle; }
        .user-cell { display: flex; align-items: center; gap: 12px; }

        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-active { background: var(--success-light); color: var(--success); }

        .action-btns { display: flex; gap: 6px; }
        .action-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--gray-200); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gray-500); transition: var(--transition); font-size: 13px; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

        .page-btn:hover { background: var(--gray-50); border-color: var(--primary); color: var(--primary); }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-100); overflow: hidden; transition: var(--transition); }
        .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); }

        .card-desc { font-size: 13px; color: var(--gray-500); line-height: 1.6; margin-bottom: 16px; }

        .card-meta-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray-500); }

        .card-btn:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

let currentRole = 'admin';

function init() {
    renderSidebar();
    renderAllPages();
    showPage('dashboard');
}

function renderSidebar() {
    const menuData = data[currentRole].menu;
    let html = '';
    menuData.forEach(function(section) {
        html += '<div class="nav-section"><div class="nav-section-title">' + section.section + '</div>';
        section.items.forEach(function(item) {
            html += '<div class="nav-item" id="nav-' + item.id + '" onclick="showPage(\'' + item.id + '\')">' +
                '<i class="fas ' + item.icon + '"></i>' +
                '<span>' + item.label + '</span>' +
                (item.badge ? '<span class="nav-badge">' + item.badge + '</span>' : '') +
                '</div>';
        });
        html += '</div>';
    });
    document.getElementById('sidebarNav').innerHTML = html;
}

function renderAllPages() {
    const container = document.getElementById('pageContent');
    container.innerHTML = '';
    container.innerHTML += renderAdminDashboard();
    container.innerHTML += renderAdminAnalytics();
    container.innerHTML += renderAthletesPage();
    container.innerHTML += renderCoachesPage();
    container.innerHTML += renderTeamsPage();
    container.innerHTML += renderSchedulesPage();
    container.innerHTML += renderEventsPage();
    container.innerHTML += renderPaymentsPage();
    container.innerHTML += renderSubscriptionsPage();
    container.innerHTML += renderExpensesPage();
    container.innerHTML += renderReportsPage();
    container.innerHTML += renderSettingsPage();
    container.innerHTML += renderProfilePage();
    container.innerHTML += renderUserDashboard();
    container.innerHTML += renderMySchedule();
    container.innerHTML += renderMyPerformance();
    container.innerHTML += renderMyCoach();
    container.innerHTML += renderMyTeam();
    container.innerHTML += renderTrainingPlans();
    container.innerHTML += renderNutrition();
    container.innerHTML += renderUpcomingEvents();
    container.innerHTML += renderMyResults();
    container.innerHTML += renderUserPayments();
    container.innerHTML += renderMessages();
}

function showPage(pageId) {
    currentPage = pageId;
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    var page = document.getElementById('page-' + pageId);
    if (page) page.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    var nav = document.getElementById('nav-' + pageId);
    if (nav) nav.classList.add('active');
    var pageNames = {
        'dashboard': 'Dashboard', 'analytics': 'Analytics', 'athletes': 'Athletes', 'coaches': 'Coaches',
        'teams': 'Teams', 'schedules': 'Schedules', 'events': 'Events', 'payments': 'Payments',
        'subscriptions': 'Subscriptions', 'expenses': 'Expenses', 'reports': 'Reports', 'settings': 'Settings',
        'profile': 'Profile', 'my-schedule': 'My Schedule', 'my-performance': 'My Performance',
        'my-coach': 'My Coach', 'my-team': 'My Team', 'training-plans': 'Training Plans', 'nutrition': 'Nutrition',
        'upcoming-events': 'Upcoming Events', 'my-results': 'My Results', 'messages': 'Messages'
    };
    document.getElementById('pageTitle').innerHTML = (pageNames[pageId] || pageId) + ' <span class="breadcrumb">/ Overview</span>';
    toggleMobileSidebar(false);
}

function switchRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
    event.target.classList.add('active');
    var userData = data[role];
    document.getElementById('userName').textContent = userData.name;
    document.getElementById('userRole').textContent = userData.role;
    document.getElementById('sidebarAvatar').src = 'https://ui-avatars.com/api/?name=' + userData.avatar + '&background=2563eb&color=fff&size=80';
    document.getElementById('headerAvatar').src = 'https://ui-avatars.com/api/?name=' + userData.avatar + '&background=2563eb&color=fff&size=80';
    renderSidebar();
    renderAllPages();
    showPage('dashboard');
}

function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('toggleIcon').className = sidebarCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
}

function toggleMobileSidebar(force) {
    if (typeof force === 'boolean') {
        document.getElementById('sidebar').classList.toggle('mobile-open', force);
        document.getElementById('mobileOverlay').classList.toggle('active', force);
    } else {
        document.getElementById('sidebar').classList.toggle('mobile-open');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
}

function renderSchedulesPage() {

    let html = '<div class="page" id="page-schedules"><div class="grid-2"><div class="chart-container"><div class="chart-header"><div class="chart-title"><i class="fas fa-calendar" style="margin-right:8px;color:var(--primary)"></i>July 2026</div></div><div class="calendar-grid"><div class="calendar-day-header">Sun</div><div class="calendar-day-header">Mon</div><div class="calendar-day-header">Tue</div><div class="calendar-day-header">Wed</div><div class="calendar-day-header">Thu</div><div class="calendar-day-header">Fri</div><div class="calendar-day-header">Sat</div>';
    for (var i = 1; i <= 31; i++) {
        var isToday = i === 21;
        var hasEvent = [5,12,15,18,21,22,23,24,25,28,30].indexOf(i) !== -1;
        html += '<div class="calendar-day ' + (isToday ? 'today ' : '') + (hasEvent ? 'event ' : '') + (i < 21 ? 'other-month' : '') + '" onclick="window.location.href=\'404.html\'">' + i + '</div>';
    }
    html += '</div></div><div>';
    schedules.forEach(function(s) {
        html += '<div class="chart-container" style="margin-bottom:16px"><div class="chart-header"><div class="chart-title" style="color:var(--primary)">' + s.day + '</div></div><div class="timeline">';
