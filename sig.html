<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,black,black,black);
padding:20px;
}
.box{
width:100%;
max-width:430px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.3);
color:#ffffff;
}
h2{text-align:center;margin-bottom:20px;}
.input{
position:relative;
margin-bottom:15px;
}
.input input,.input select{
width:100%;
padding:13px 45px 13px 15px;
border:none;
border-radius:10px;
outline:none;
}
.input i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#555;
}
button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:#fff;
color:#462cae;
font-weight:bold;
cursor:pointer;
}
button:hover{
background:blue;
color:#fff;
}
.bottom{
margin-top:18px;
text-align:center;
}
.bottom a{color:#fff;font-weight:bold;}
label{font-size:14px;}
</style>

</head>
<body>

<div class="box">

<h2>Create Account</h2>

<form id="signupForm">

<div class="input">
<input type="text" id="name" placeholder="Full Name" required>
</div>

<div class="input">
<input type="text" id="mobile" maxlength="10" placeholder="Mobile Number" required>
</div>

<div class="input">
<input type="email" id="email" placeholder="Email Address" required>
</div>

<!-- <div class="input">
<select required>
<option value="">Select Role</option>
<option>User</option>
<option>Admin</option>
</select>
</div> -->

<div class="input">
<input type="password" id="password" placeholder="Password" required>
<i class="bi bi-eye" id="eye1"></i>
</div>

<div class="input">
<input type="password" id="confirm" placeholder="Confirm Password" required>
<i class="bi bi-eye" id="eye2"></i>
</div>

<label>
<input type="checkbox" required>
I Agree Terms & Conditions
</label>

<br><br>

<button>Create Account</button>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<script>
const nameInput = document.getElementById("name");
const mobileInput = document.getElementById("mobile");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");
const eye1 = document.getElementById("eye1");
const eye2 = document.getElementById("eye2");
const signupForm = document.getElementById("signupForm");

// Name - letters and spaces only
nameInput.addEventListener("input", function () {
    this.value = this.value.replace(/[^a-zA-Z ]/g, "");
});

// Mobile - numbers only, maximum 10 digits
mobileInput.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
});

// Show / Hide Password
eye1.addEventListener("click", function () {
    passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";

    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");
});

// Show / Hide Confirm Password
eye2.addEventListener("click", function () {
    confirmInput.type =
        confirmInput.type === "password" ? "text" : "password";

    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");
});

// Confirm Password validation
confirmInput.addEventListener("input", function () {
    if (this.value !== passwordInput.value) {
        this.setCustomValidity("Passwords do not match.");
    } else {
        this.setCustomValidity("");
    }
});

// Clear mismatch when original password changes
passwordInput.addEventListener("input", function () {
    if (confirmInput.value !== "") {
        confirmInput.setCustomValidity(
            confirmInput.value !== this.value
                ? "Passwords do not match."
                : ""
        );
    }
});

// Form submission
signupForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const password = passwordInput.value;
    const confirm = confirmInput.value;

    // Check mobile number
    if (!/^\d{10}$/.test(mobileInput.value)) {
        alert("Please enter a valid 10-digit mobile number.");
        mobileInput.focus();
        return;
    }

    // Password requirements
    const pattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if (!pattern.test(password)) {
        alert(
            "Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special character."
        );
        passwordInput.focus();
        return;
    }

    // Confirm password check
    if (password !== confirm) {
        alert("Passwords do not match. Please enter the same password.");
        confirmInput.focus();
        return;
    }

    alert("Account Created Successfully!");
    window.location.href = "login.html";
});
</script>


</body>
</html>
