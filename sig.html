<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,black,black,black);
padding:20px;
}
.box{
width:100%;
max-width:430px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.3);
color:#ffffff;
}
h2{text-align:center;margin-bottom:20px;}
.input{
position:relative;
margin-bottom:15px;
}
.input input,.input select{
width:100%;
padding:13px 45px 13px 15px;
border:none;
border-radius:10px;
outline:none;
}
.input i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#555;
}
button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:#fff;
color:#462cae;
font-weight:bold;
cursor:pointer;
}
button:hover{
background:blue;
color:#fff;
}
.bottom{
margin-top:18px;
text-align:center;
}
.bottom a{color:#fff;font-weight:bold;}
label{font-size:14px;}
</style>

</head>
<body>

<div class="box">

<h2>Create Account</h2>

<form id="signupForm">

<div class="input">
<input type="text" id="name" placeholder="Full Name" required>
</div>

<div class="input">
<input type="text" id="mobile" maxlength="10" placeholder="Mobile Number" required>
</div>

<div class="input">
<input type="email" id="email" placeholder="Email Address" required>
</div>

<!-- <div class="input">
<select required>
<option value="">Select Role</option>
<option>User</option>
<option>Admin</option>
</select>
</div> -->

<div class="input">
<input type="password" id="password" placeholder="Password" required>
<i class="bi bi-eye" id="eye1"></i>
</div>

<div class="input">
<input type="password" id="confirm" placeholder="Confirm Password" required>
<i class="bi bi-eye" id="eye2"></i>
</div>

<label>
<input type="checkbox" required>
I Agree Terms & Conditions
</label>

<br><br>

<button>Create Account</button>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<script>

// Name letters only
document.getElementById("name").addEventListener("input",function(){
this.value=this.value.replace(/[^a-zA-Z ]/g,"");
});

// Mobile numbers only
document.getElementById("mobile").addEventListener("input",function(){
this.value=this.value.replace(/\D/g,"").slice(0,10);
});

// Show Password
eye1.onclick=function(){
password.type=password.type==="password"?"text":"password";
}

eye2.onclick=function(){
confirm.type=confirm.type==="password"?"text":"password";
}

document.getElementById("signupForm").addEventListener("submit",function(e){

e.preventDefault();

let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

let pattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

if(!pattern.test(password)){
alert("Password must contain 8 characters, Uppercase, Lowercase, Number & Special Character.");
return;
}

if(password!==confirm){
alert("Passwords do not match.");
return;
}

alert("Account Created Successfully");

window.location="login.html";

});
</script>

</body>
</html>
